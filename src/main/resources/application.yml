server:
  port: 8083

spring:
  application:
    name: camel-integration-hub
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/integration-hub;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

camel:
  dataformat:
    jackson:
      auto-discover-object-mapper: true
  metrics:
    enable-route-policy: true
    enable-route-event-notifier: true
    enable-exchange-event-notifier: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

info:
  app:
    name: Camel Integration Hub
    version: 0.1.0-SNAPSHOT
    description: Apache Camel integration patterns showcase.

logging:
  level:
    org.apache.camel: INFO

integration:
  delivery:
    url: ${DELIVERY_URL:http://localhost:${server.port}/api/demo/downstream/orders}
    maximum-redeliveries: ${DELIVERY_MAXIMUM_REDELIVERIES:2}
    redelivery-delay: ${DELIVERY_REDELIVERY_DELAY:100}
  sftp:
    enabled: false
    host: ${SFTP_HOST:localhost}
    port: ${SFTP_PORT:2222}
    username: ${SFTP_USERNAME:camel}
    password: ${SFTP_PASSWORD:camel}
    directory: ${SFTP_DIRECTORY:upload}
    poll-delay: ${SFTP_POLL_DELAY:5000}
    strict-host-key-checking: ${SFTP_STRICT_HOST_KEY_CHECKING:no}
    use-user-known-hosts-file: ${SFTP_USE_USER_KNOWN_HOSTS_FILE:false}
