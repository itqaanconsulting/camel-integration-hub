server:
  port: 8083

spring:
  application:
    name: camel-integration-hub

management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: Camel Integration Hub
    version: 0.1.0-SNAPSHOT
    description: Apache Camel integration patterns showcase.

logging:
  level:
    org.apache.camel: INFO

integration:
  sftp:
    enabled: false
    host: localhost
    port: 2222
    username: camel
    password: camel
    directory: upload
    poll-delay: 5000
